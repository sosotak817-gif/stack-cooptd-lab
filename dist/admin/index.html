<body><main class="portal" id="admin-content" hidden>
<section class="panel"><h1>관리자</h1><p>스택 계정 · 전체 데이터 관리</p><p id="admin-status" role="status"></p>
<h2>투표 관리</h2><button type="button" data-reset="gems">보석 투표 초기화</button> <button type="button" data-reset="demons">초마신 투표 초기화</button>
</section>
<section class="panel"><h2>개별 투표 관리</h2>
<label>티어리스트 <select id="admin-vote-kind"><option value="demons">초마신</option><option value="gems">보석</option></select></label>
<button type="button" id="admin-vote-refresh">새로고침</button>
<p id="admin-vote-status" role="status"></p>
<div style="overflow:auto"><table class="stage-table"><thead><tr><th>투표자</th><th>1~7위 순위</th><th>마지막 투표</th><th>관리</th></tr></thead><tbody id="admin-vote-list"></tbody></table></div>
<div><button type="button" id="admin-vote-prev">이전</button> <button type="button" id="admin-vote-next">다음</button></div>
</section>
<section class="panel"><h2>데이터 관리</h2><p>테이블을 선택해 내용을 조회하거나 SQL로 조회·수정·삭제할 수 있습니다.</p>
<label>테이블 <select id="admin-table"></select></label> <button type="button" id="admin-inspect">조회</button>
<form id="admin-sql-form"><label for="admin-sql">실행할 SQL</label><textarea id="admin-sql" rows="7" style="display:block;width:100%;box-sizing:border-box" required maxlength="20000" spellcheck="false"></textarea><p><label><input type="checkbox" id="admin-write">데이터 변경 SQL 실행 허용</label></p><button id="admin-run">실행</button></form>
<pre id="admin-result" style="overflow:auto;max-height:60vh;white-space:pre-wrap;overflow-wrap:anywhere"></pre>
</section></main><p id="admin-access" role="status">관리자 권한을 확인하는 중…</p></body></html>
